<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Reviewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
        }
        h1 { text-align: center; color: #2563eb; margin-top: 0; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; }
        
        .form-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label { font-weight: 600; margin-bottom: 8px; color: #334155; }
        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus { outline: none; border-color: #2563eb; ring: 2px solid #2563eb; }
        
        button {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        
        .error { background: #fee2e2; color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;}
        
        .results-card {
            background: #f1f5f9;
            padding: 25px;
            border-radius: 8px;
            margin-top: 30px;
            border-left: 5px solid #2563eb;
        }
        .results-card h2 { margin-top: 0; color: #0f172a; }
        .result-text { 
            white-space: pre-wrap; /* This preserves the Gemini API's newlines and bullet points */
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AI Resume Reviewer</h1>
        <p class="subtitle">Paste a Job Description and your Resume to get an instant ATS match score and critique.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <div class="input-box">
                    <label for="jd">Job Description</label>
                    <textarea name="jd" id="jd" placeholder="Paste the full job description here..." required></textarea>
                </div>
                <div class="input-box">
                    <label for="resume">Your Resume</label>
                    <textarea name="resume" id="resume" placeholder="Paste your raw resume text here..." required></textarea>
                </div>
            </div>
            <button type="submit">Analyze Match</button>
        </form>

        {% if result %}
            <div class="results-card">
                <h2>📊 Analysis Results</h2>
                <div class="result-text">{{ result }}</div>
            </div>
        {% endif %}
    </div>
</body>
</html>
