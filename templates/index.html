<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>AI Resume Reviewer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,.12);
            transition: transform .2s ease;
            width: 100%;
            max-width: 900px;
        }
        .container:hover{
            transform: translateY(-2px);
        }
        h1 { text-align: center; color: #2563eb; margin-top: 0; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 30px; }
        
        .form-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .input-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label { font-weight: 600; margin-bottom: 8px; color: #334155; }
        textarea {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus { outline: none; border-color: #2563eb; ring: 2px solid #2563eb; }
        
    button{
        width:100%;
        background:linear-gradient(90deg,#2563eb,#4f46e5);
        color:white;
        border:none;
        padding:15px;
        border-radius:10px;
        font-size:17px;
        font-weight:600;
        cursor:pointer;
        transition:.3s;
    }

    button:hover{
        transform:translateY(-2px);
        box-shadow:0 8px 20px rgba(37,99,235,.3);
    }
    button:disabled {
        opacity: 0.8;
        cursor: not-allowed;
        transform: none;
    }
        
    .error { background: #fee2e2; color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;}
        
        .results-card {
            background:#ffffff;
            padding: 25px;
            border-radius: 8px;
            margin-top: 30px;
            border-left: 5px solid #2563eb;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
        }
        .results-card h2 { margin-top: 0; color: #0f172a; }
        .result-text { 
            white-space: pre-wrap; /* This preserves the Gemini API's newlines and bullet points */
            line-height: 1.6;
        }
    @media (max-width: 768px) {
        .form-group {
            flex-direction: column;
        }

        textarea {
            height: 220px;
        }

        body {
            padding: 20px 10px;
        }
    }    
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AI Resume Reviewer</h1>
        <p class="subtitle">Paste a Job Description and your Resume to get an instant ATS match score and critique.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <div class="input-box">
                    <label for="jd">Job Description</label>
                    <textarea name="jd" id="jd" placeholder="Paste the full job description here..." required></textarea>
                </div>
                <div class="input-box">
                    <label for="resume">Your Resume</label>
                    <textarea name="resume" id="resume" placeholder="Paste your raw resume text here..." required></textarea>
                </div>
            </div>
            <button type="submit">Analyze Match</button>
        </form>

        {% if result %}
            <div class="results-card">
                <h2>📊 Analysis Results</h2>
                <div class="result-text">{{ result }}</div>
            </div>
        {% endif %}
    </div>
    <script>
    document.querySelector("form").addEventListener("submit", function () {

        const btn = this.querySelector("button");

        btn.disabled = true;

        btn.innerHTML = `
        <span class="spinner-border spinner-border-sm"></span>
        Analyzing Resume...
        `;
    });
    </script>
    <footer style="margin-top:30px;color:#64748b;font-size:14px;">
        Built with ❤️ using Flask & Google Gemini
    </footer>
</body>
</html>
